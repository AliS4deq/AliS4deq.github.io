<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Sadeq</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid #30363d;
      margin: 0 auto 1.25rem;
      display: block;
      background: #21262d;
      object-fit: cover;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 0.4rem;
    }

    .handle {
      font-size: 1rem;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #c9d1d9;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid #30363d;
      color: #c9d1d9;
      background: #21262d;
      transition: border-color 0.15s, background 0.15s;
    }

    .links a:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    footer, .footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      class="avatar"
      src="https://github.com/AliS4deq.png"
      alt=""
      onerror="this.style.visibility='hidden'"
    />
    <h1>Ali Sadeq</h1>
    <p class="handle">@AliS4deq</p>
    <p class="bio">Welcome to my personal website. I build things for the web.</p>
    <nav class="links">
      <a href="https://github.com/AliS4deq" target="_blank" rel="noopener noreferrer">
        <!-- GitHub icon -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">

            -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
            .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
            -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
            .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
            .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
            0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub

    </nav>
  </div>
  <p class="footer">alisadeq.me</p>
</body>
</html>
